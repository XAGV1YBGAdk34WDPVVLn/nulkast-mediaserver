<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NulKast MediaServer</title>
  <link rel="stylesheet" href="/web/style.css?v=5" />
  <script src="/web/hls.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span id="brand-name">NULKAST MEDIA</span>
      <span id="hw-badge" class="pill">CHECKING HW...</span>
    </div>
    <nav class="nav-tabs" role="tablist">
      <button class="nav-btn focusable active" data-tab="home">Home</button>
      <button class="nav-btn focusable" data-tab="movies">Movies</button>
      <button class="nav-btn focusable" data-tab="shows">TV Shows</button>
      <button class="nav-btn focusable" id="btn-scan" title="Rescan Library">↻ Scan</button>
      <button class="nav-btn focusable" id="btn-diag" title="Toggle Diagnostics">Diag: ON</button>
    </nav>
    <div class="search-wrap">
      <input id="search-input" class="focusable" type="search" placeholder="Search movies & TV..." />
    </div>
  </header>

  <section id="diag-panel" class="diag-panel hidden">
    <div class="diag-head">
      <strong>Diagnostics Telemetry</strong>
      <div class="diag-actions">
        <button id="btn-diag-refresh" class="pill-btn focusable">↻ Refresh</button>
        <button id="btn-diag-hide" class="pill-btn focusable">Hide</button>
      </div>
    </div>
    <pre id="diag-output" class="diag-output">Loading diagnostics...</pre>
  </section>

  <main id="content" class="content">
    <section id="view-home" class="view active">
      <div id="continue-section" class="section hidden">
        <h2>Continue Watching</h2>
        <div id="continue-grid" class="card-grid"></div>
      </div>
      <div class="section">
        <h2>Movies</h2>
        <div id="home-movies-grid" class="card-grid"></div>
      </div>
      <div class="section">
        <h2>TV Shows</h2>
        <div id="home-shows-grid" class="card-grid"></div>
      </div>
    </section>

    <section id="view-movies" class="view">
      <div class="movies-toolbar">
        <h2 id="movies-heading">All Movies</h2>
        <div class="chip-row" role="group" aria-label="Sort Movies">
          <span class="chip-label">Sort:</span>
          <button class="chip focusable active" data-sort="added">Newest Added</button>
          <button class="chip focusable" data-sort="year_desc">Release Year ↓</button>
          <button class="chip focusable" data-sort="year_asc">Release Year ↑</button>
          <button class="chip focusable" data-sort="az">A → Z</button>
          <button class="chip focusable" data-sort="za">Z → A</button>
        </div>
        <div id="genre-chips" class="chip-row" role="group" aria-label="Filter by Genre"></div>
      </div>
      <div id="movies-grid" class="card-grid"></div>
    </section>

    <section id="view-shows" class="view">
      <div class="section-head">
        <button id="btn-back-shows" class="pill-btn focusable hidden">← All Shows</button>
        <h2 id="shows-heading">TV Shows</h2>
      </div>
      <div id="shows-toolbar" class="movies-toolbar">
        <div class="chip-row" role="group" aria-label="Sort TV Shows">
          <span class="chip-label">Sort:</span>
          <button class="chip focusable active" data-show-sort="added">Newest Added</button>
          <button class="chip focusable" data-show-sort="episodes">Most Episodes</button>
          <button class="chip focusable" data-show-sort="az">A → Z</button>
          <button class="chip focusable" data-show-sort="za">Z → A</button>
        </div>
        <div id="show-genre-chips" class="chip-row" role="group" aria-label="Filter TV Shows by Genre"></div>
      </div>
      <div id="shows-grid" class="card-grid"></div>
      <div id="episodes-list" class="episode-list hidden"></div>
    </section>

    <section id="view-search" class="view">
      <h2 id="search-heading">Search Results</h2>
      <div id="search-grid" class="card-grid"></div>
    </section>
  </main>

  <!-- Fullscreen Video Player Overlay -->
  <div id="player-overlay" class="player-overlay hidden">
    <div class="player-top">
      <button id="btn-close-player" class="pill-btn focusable">← Back</button>
      <div class="player-title-wrap">
        <div id="player-title" class="player-title"></div>
        <div id="player-stats" class="player-stats"></div>
      </div>
      <div class="player-controls-top">
        <select id="quality-select" class="pill-select focusable">
          <option value="auto">Auto (Fastest)</option>
          <option value="remux">Remux (Zero Video Encode)</option>
          <option value="1080p">1080p HW</option>
          <option value="720p">720p HW</option>
          <option value="480p">480p HW</option>
        </select>
        <select id="sub-select" class="pill-select focusable">
          <option value="-1">Subtitles: Off</option>
        </select>
      </div>
    </div>
    <video id="video-el" autoplay playsinline></video>
    <div id="player-bottom" class="player-bottom">
      <div id="seek-bar" class="seek-bar focusable" tabindex="0" title="Click or use Left/Right stick to scrub, A/Enter to jump">
        <div id="seek-buffered" class="seek-buffered"></div>
        <div id="seek-played" class="seek-played"></div>
        <div id="seek-thumb" class="seek-thumb"></div>
        <div id="seek-preview" class="seek-preview hidden">0:00</div>
      </div>
      <div class="player-controls-bottom">
        <div class="player-btn-group">
          <button id="btn-play-pause" class="pill-btn focusable">⏸ Pause</button>
          <button id="btn-restart" class="pill-btn focusable" title="Restart from beginning">⏮ Restart</button>
          <button id="btn-rw" class="pill-btn focusable">↺ -10s</button>
          <button id="btn-ff" class="pill-btn focusable">↻ +30s</button>
          <span id="player-time" class="player-time">0:00 / 0:00</span>
        </div>
        <div class="player-btn-group">
          <span class="xbox-hints">LB/RB ±10/30s • LT/RT ±60s • Stick Scrub + A • X Play/Pause • B Back</span>
          <button id="btn-mute" class="pill-btn focusable">🔊</button>
          <input id="vol-slider" class="vol-slider" type="range" min="0" max="1" step="0.05" value="1" />
          <button id="btn-fullscreen" class="pill-btn focusable">⛶ Fullscreen</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/web/app.js?v=5"></script>
</body>
</html>
